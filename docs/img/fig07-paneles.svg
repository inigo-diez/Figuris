<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Separación de paneles: AP50 frente a las cajas humanas</title><desc id="d">Barras horizontales. El método mejora de 0,54 a 0,83 en las figuras usadas para diseñarlo, pero da 0,61 en las 34 figuras nuevas de validation. Umbral 0,85.</desc>

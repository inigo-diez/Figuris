<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17212B"/></marker></defs>
<text x="22" y="30" font-size="14" fill="#17212B" font-weight="600" text-anchor="start">Paneles bien localizados (AP con IoU ≥ 0,5)</text>

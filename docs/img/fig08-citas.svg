<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Citas inventadas en test</title><desc id="d">De 149 explicaciones con 1437 afirmaciones y 1716 citas, el modelo inventó 7 citas en 5 explicaciones; el validador detectó las 7 y ninguna se muestra como fiable.</desc>
<rect width="960" height="210" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17212B"/></marker></defs>
<text x="22" y="30" font-size="14" fill="#17212B" font-weight="600" text-anchor="start">Control de citas en test</text>
<rect x="22" y="54" width="205" height="128" rx="6" fill="#FFFFFF" stroke="#17212B" stroke-width="1.2"/>
<text x="38" y="98" font-size="30" fill="#17212B" font-weight="600" text-anchor="start">149</text>
<text x="38" y="124" font-size="13" fill="#17212B" font-weight="600" text-anchor="start">explicaciones de test</text>
<text x="38" y="146" font-size="11.5" fill="#66717D" font-weight="400" text-anchor="start">1 437 afirmaciones, 1 716 citas</text>
<line x1="227" y1="118" x2="256" y2="118" stroke="#17212B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="257" y="54" width="205" height="128" rx="6" fill="#FFFFFF" stroke="#17212B" stroke-width="1.2"/>
<text x="273" y="98" font-size="30" fill="#17212B" font-weight="600" text-anchor="start">7</text>
<text x="273" y="124" font-size="13" fill="#17212B" font-weight="600" text-anchor="start">citas inventadas</text>
<text x="273" y="146" font-size="11.5" fill="#66717D" font-weight="400" text-anchor="start">en 5 explicaciones: 4 de párrafo,</text>
<text x="273" y="162" font-size="11.5" fill="#66717D" font-weight="400" text-anchor="start">1 del pie, 2 a afirmaciones</text>
<line x1="462" y1="118" x2="491" y2="118" stroke="#17212B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="492" y="54" width="205" height="128" rx="6" fill="#EEF5F4" stroke="#17212B" stroke-width="1.2"/>
<text x="508" y="98" font-size="30" fill="#176B67" font-weight="600" text-anchor="start">7 de 7</text>
<text x="508" y="124" font-size="13" fill="#17212B" font-weight="600" text-anchor="start">detectadas</text>
<text x="508" y="146" font-size="11.5" fill="#66717D" font-weight="400" text-anchor="start">por el validador, sin IA</text>
<line x1="697" y1="118" x2="726" y2="118" stroke="#17212B" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="727" y="54" width="205" height="128" rx="6" fill="#EEF5F4" stroke="#17212B" stroke-width="1.2"/>
<text x="743" y="98" font-size="30" fill="#176B67" font-weight="600" text-anchor="start">0</text>
<text x="743" y="124" font-size="13" fill="#17212B" font-weight="600" text-anchor="start">mostradas como fiables</text>
<text x="743" y="146" font-size="11.5" fill="#66717D" font-weight="400" text-anchor="start">las 5 aparecen como «no fiable»</text>
</svg>
